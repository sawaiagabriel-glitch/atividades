<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Frete</title>
</head>

<body>

    <h1>Calculadora de Frete</h1>

    <form id="form-frete">

        <label for="valor">Valor do carrinho:</label>
        <input
            type="number"
            id="valor"
            step="0.01"
            required
        >

        <br><br>

        <label for="regiao">Região:</label>

        <select id="regiao">
            <option value="Sudeste">Sudeste</option>
            <option value="Sul">Sul</option>
            <option value="Centro-Oeste">Centro-Oeste</option>
            <option value="Nordeste">Nordeste</option>
            <option value="Norte">Norte</option>
        </select>

        <br><br>

        <button type="submit">
            Calcular frete
        </button>

    </form>

    <p id="resultado"></p>


    <script>

        const formulario = document.getElementById("form-frete");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();

            const valor = document.getElementById("valor").value;
            const regiao = document.getElementById("regiao").value;

            const resposta = await fetch("/calcular", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    valor_carrinho: valor,
                    regiao: regiao
                })

            });

            const dados = await resposta.json();

            if (dados.erro) {

                resultado.textContent =
                    "Erro: " + dados.erro;

            } else {

                resultado.textContent =
                    "Valor do frete: R$ " +
                    dados.frete.toFixed(2);

            }

        });

    </script>

</body>
</html>
